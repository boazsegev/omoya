<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Omoya logo</title>
  <desc id="description">A rounded dark tile containing a bold letter O and a teal command prompt.</desc>
  <!-- Add class="monochrome" to the root svg element for the one-color variant. -->
  <style>
    svg { --tile: #10182b; --mark: #fff; --accent: #35dbc5; }
    svg.monochrome { --tile: #000; --mark: #fff; --accent: #fff; }
  </style>
  <rect width="512" height="512" rx="112" fill="var(--tile)"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="var(--mark)" stroke-width="58"/>
  <path d="M218 207 274 256 218 305" fill="none" stroke="var(--accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 305h38" fill="none" stroke="var(--accent)" stroke-width="34" stroke-linecap="round"/>
</svg>
