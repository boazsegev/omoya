# bunfig.toml — Bun configuration.
# The test preload (ollama-independence gate + AI_SETTINGS_DIR
# isolation) applies to every `bun test` invocation; the CI gate's
# explicit `--preload ./test/preload.js` loads the same file.
[test]
preload = ["./test/preload.js"]
# Bare `bun test` runs only the suite, never scratch *.test.js copies
# under ai-cache/, ai-tasks/ or other transient folders.
root = "./test"
